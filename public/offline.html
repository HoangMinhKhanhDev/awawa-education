<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563EB">
    <title>awawa — Đang ngoại tuyến</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 24px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0b1220;
                color: #e2e8f0;
            }
        }

        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: rgba(37, 99, 235, 0.06);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 24px;
            padding: 40px 28px;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 22px;
            opacity: 0.75;
        }

        button {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 14px;
            padding: 12px 22px;
            color: #fff;
            background: #2563eb;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">HSG</div>
        <h1>Bạn đang ngoại tuyến</h1>
        <p>awawa cần kết nối mạng để tải dữ liệu mới nhất. Hãy kiểm tra kết nối rồi thử lại.</p>
        <button type="button" onclick="location.reload()">Thử lại</button>
    </div>
</body>
</html>
