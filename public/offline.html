<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2154d6">
    <title>awawa — Đang ngoại tuyến</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f6f7f9;
            --surface: #ffffff;
            --rule: #e1e6ee;
            --ink: #141b2d;
            --ink-soft: #5b6678;
            --ink-faint: #8a93a6;
            --brand: #2154d6;
            --grid: rgba(20, 27, 45, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #0e1118;
                --surface: #151a24;
                --rule: #263041;
                --ink: #e6e9f0;
                --ink-soft: #9aa4b6;
                --ink-faint: #6b7488;
                --brand: #4e7bea;
                --grid: rgba(255, 255, 255, 0.035);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--paper);
            background-image:
                linear-gradient(to right, var(--grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink);
            font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .sheet {
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--rule);
            border-radius: 14px;
            background: var(--surface);
            padding: 32px 28px;
        }

        .mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        h1 {
            margin: 20px 0 8px;
            font-size: 22px;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 22px;
            font-size: 14px;
            line-height: 1.65;
            color: var(--ink-soft);
        }

        button {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            color: #fff;
            background: var(--brand);
        }

        button:hover { filter: brightness(0.94); }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="mark">HSG</div>
        <h1>Bạn đang ngoại tuyến</h1>
        <p>awawa cần kết nối mạng để lấy dữ liệu mới nhất. Kiểm tra kết nối rồi thử lại.</p>
        <button type="button" onclick="location.reload()">Thử lại</button>
    </div>
</body>
</html>
